name: Jellyfin Plugin Stable Release

on:
  release:
    types:
      - published

permissions:
  contents: write
  deployments: write
  id-token: write
  pages: write

concurrency:
  group: stable-release
  cancel-in-progress: false

jobs:
  build:
    name: Build Stable Release
    if: github.event.release.prerelease == false
    runs-on: ubuntu-latest
    outputs:
      abi-version: ${{ steps.abi-version.outputs.version }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Validate four-part version
        id: version
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          if ($env:RELEASE_TAG -notmatch '^\d+\.\d+\.\d+\.\d+$') {
            throw "Release tag must be a four-part version such as 1.7.6.100"
          }
          "version=$env:RELEASE_TAG" >> $env:GITHUB_OUTPUT
      - name: Patch assembly version
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $path = 'Directory.Build.props'
          $content = Get-Content $path -Raw
          $content = $content -replace '<Version>[^<]+</Version>', "<Version>$env:VERSION</Version>"
          $content = $content -replace '<AssemblyVersion>[^<]+</AssemblyVersion>', "<AssemblyVersion>$env:VERSION</AssemblyVersion>"
          $content = $content -replace '<FileVersion>[^<]+</FileVersion>', "<FileVersion>$env:VERSION</FileVersion>"
          Set-Content $path $content -Encoding utf8NoBOM
      - name: Setup .NET 9.x
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.x
      - name: Restore NuGet Packages
        run: dotnet restore
      - name: Test
        run: dotnet test --configuration Release Jellyfin.Plugin.Bangumi.Test
      - name: Publish Jellyfin Plugin
        run: dotnet publish --configuration Release --no-restore --output publish Jellyfin.Plugin.Bangumi
      - name: Resolve Target ABI Version
        id: abi-version
        shell: pwsh
        run: |
          $dll = Get-ChildItem -Path ~/.nuget/packages/jellyfin.controller -Filter 'MediaBrowser.Controller.dll' -Recurse | Select-Object -First 1
          $version = [System.Reflection.AssemblyName]::GetAssemblyName($dll.FullName).Version.ToString()
          "version=$version" >> $env:GITHUB_OUTPUT
      - name: Generate Jellyfin Plugin Metadata
        shell: pwsh
        env:
          CHANGELOG: ${{ github.event.release.body }}
          VERSION: ${{ steps.version.outputs.version }}
          ABI_VERSION: ${{ steps.abi-version.outputs.version }}
        run: |
          @{
            category = 'Metadata'
            changelog = $env:CHANGELOG
            description = 'Jellyfin bgm.tv 数据源插件，增加 Bangumi 到 Jellyfin 的单向已看同步。'
            guid = '41b59f1b-a6cf-474a-b416-785379cbd856'
            name = 'Bangumi'
            overview = 'bgm.tv metadata provider and watched-state sync for Jellyfin'
            owner = 'atwist227'
            targetAbi = $env:ABI_VERSION
            timestamp = Get-Date -AsUTC -Format s
            version = $env:VERSION
            imageUrl = 'https://atwist227.github.io/jellyfin-plugin-bangumi/poster.png'
          } | ConvertTo-Json -Compress | Out-File 'publish/meta.json' -Encoding utf8NoBOM -NoNewline
      - name: Create Jellyfin Plugin Package
        run: zip -9j Jellyfin.Plugin.Bangumi.zip publish/*.dll publish/meta.json
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: stable-plugin
          path: |
            Jellyfin.Plugin.Bangumi.zip
            poster.png

  upload:
    name: Attach Package to Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: stable-plugin
      - name: Upload package
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ github.token }}
          tag: ${{ needs.build.outputs.version }}
          overwrite: true
          file: Jellyfin.Plugin.Bangumi.zip

  repository:
    name: Build Stable Plugin Repository
    needs: [build, upload]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: stable-plugin
      - name: Create repository.json and retain custom stable history
        shell: pwsh
        env:
          CHANGELOG: ${{ github.event.release.body }}
          VERSION: ${{ needs.build.outputs.version }}
          ABI_VERSION: ${{ needs.build.outputs.abi-version }}
        run: |
          New-Item -ItemType Directory -Force -Path Release | Out-Null
          $previousVersions = @()
          try {
            $repository = Invoke-RestMethod 'https://atwist227.github.io/jellyfin-plugin-bangumi/repository.json'
            $previousVersions = @($repository[0].versions | Where-Object { $_.version -ne $env:VERSION })
          } catch {
            Write-Host 'No previous custom repository found; creating the first stable history.'
          }
          foreach ($previous in $previousVersions) {
            Invoke-WebRequest -Uri $previous.sourceUrl -OutFile "Release/$($previous.version).zip"
          }
          Copy-Item Jellyfin.Plugin.Bangumi.zip "Release/$env:VERSION.zip"
          Copy-Item poster.png Release/poster.png
          $current = @{
            checksum = (Get-FileHash -Algorithm MD5 Jellyfin.Plugin.Bangumi.zip).Hash.ToLowerInvariant()
            changelog = $env:CHANGELOG
            targetAbi = $env:ABI_VERSION
            sourceUrl = "https://atwist227.github.io/jellyfin-plugin-bangumi/$env:VERSION.zip"
            timestamp = Get-Date -AsUTC -Format s
            version = $env:VERSION
            imageUrl = 'https://atwist227.github.io/jellyfin-plugin-bangumi/poster.png'
          }
          @{
            category = 'Metadata'
            description = 'bgm.tv metadata provider and watched-state sync for Jellyfin'
            guid = '41b59f1b-a6cf-474a-b416-785379cbd856'
            name = 'Bangumi'
            overview = 'Jellyfin bgm.tv 数据源插件，增加 Bangumi 到 Jellyfin 的单向已看同步。'
            imageUrl = 'https://atwist227.github.io/jellyfin-plugin-bangumi/poster.png'
            owner = 'atwist227'
            versions = @($current) + $previousVersions
          } | ConvertTo-Json -Compress -Depth 6 -AsArray | Out-File Release/repository.json -Encoding utf8NoBOM -NoNewline
      - name: Upload Pages content
        uses: actions/upload-pages-artifact@v3
        with:
          path: Release/

  deploy-pages:
    name: Deploy GitHub Pages
    needs: repository
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
